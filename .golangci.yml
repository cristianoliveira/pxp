# golangci-lint configuration
# See https://golangci-lint.run/usage/configuration/
version: "2"

linters:
  default: none
  enable:
    # Code quality
    - errcheck       # Check for unchecked errors

    - govet          # Run go vet
    - ineffassign    # Detect ineffectual assignments
    - staticcheck    # Go static analysis

    - unused         # Check for unused code

    # Code duplication
    - dupl           # Code duplication detection

    # Style & best practices
    - misspell       # Spell checking
    - lll            # Enforce maximum line length

    # Complexity and function-size guardrails. These thresholds match the
    # initial repository baseline; new code must not exceed the baseline.
    - cyclop         # Check cyclomatic complexity
    - funlen         # Check function length

  settings:
    lll:
      line-length: 100

    cyclop:
      max-complexity: 40
      package-average: 0

    funlen:
      lines: 203
      statements: 127

    # Duplication settings
    dupl:
      threshold: 150  # Minimum tokens to consider as duplicate (default: 100)
                      # Higher = fewer false positives, lower = stricter

  exclusions:
    rules:
      # Test fixtures and assertions contain intentionally long serialized values.
      - path: _test\.go$
        linters:
          - goconst
          - lll
      # The self-contained HTML templates are kept readable as single templates.
      - path: internal/report/report\.go$
        linters:
          - lll
      - path: internal/review/review\.go$
        linters:
          - lll

formatters:
  enable:
    - gofmt
    - goimports

# Run settings
run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly



# Issues settings
issues:
  max-issues-per-linter: 0      # Unlimited issues per linter
  max-same-issues: 0            # Unlimited same issues

