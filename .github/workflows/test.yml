name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'

      - name: Install dependencies
        run: go mod tidy

      - name: Check formatting with gofmt
        if: always()
        run: |
          gofmt -d .
          if [ "$(gofmt -l .)" != "" ]; then
            echo "Code is not formatted properly. Run 'gofmt -w .' to fix."
            exit 1
          fi

      - name: Run go vet
        if: always()
        run: go vet ./...

      - name: Run golangci-lint
        if: always()
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.8.0
          args: --timeout=5m

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'

      - name: Install dependencies
        run: go mod tidy

      - name: Build binary
        run: go build -o pxp ./cmd/pxp

      - name: Verify binary help
        run: ./pxp --help

      - name: Install golangci-lint for the quality gate
        env:
          GOBIN: ${{ runner.temp }}/bin
        run: |
          mkdir -p "$GOBIN"
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
          echo "$GOBIN" >> "$GITHUB_PATH"

      - name: Run quality gate
        run: make quality

      - name: Run quality policy boundary tests
        run: make quality-test

      - name: Upload coverage report
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          fail_ci_if_error: false
