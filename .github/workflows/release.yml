name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Build release archives
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p dist
          for os in linux darwin windows; do
            for arch in amd64 arm64; do
              name="pxp_${os}_${arch}"
              binary=pxp
              if [ "$os" = windows ]; then binary=pxp.exe; fi
              mkdir -p "build/$name"
              GOOS="$os" GOARCH="$arch" go build -trimpath -o "build/$name/$binary" ./cmd/pxp
              cp README.md "build/$name/"
              if [ "$os" = windows ]; then
                (cd "build/$name" && zip -q "../../dist/$name.zip" "$binary" README.md)
              else
                tar -czf "dist/$name.tar.gz" -C "build/$name" "$binary" README.md
              fi
            done
          done
          (cd dist && sha256sum *.tar.gz *.zip > checksums.txt)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            flags=()
            if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" dist/* --verify-tag --generate-notes "${flags[@]}"
          fi
